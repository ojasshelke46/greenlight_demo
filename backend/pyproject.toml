[project]
name = "greenlight-backend"
version = "0.1.0"
description = "FastAPI backend that drives the TrueForge Greenlight agent"
requires-python = ">=3.12"
dependencies = [
    "aiosqlite>=0.22.1",
    "fastapi>=0.141.1",
    "httpx>=0.28.1",
    "pydantic>=2.13.5",
    "pydantic-settings>=2.15.0",
    "sse-starlette>=3.4.11",
    "uvicorn[standard]>=0.54.0",
]

[project.scripts]
dev = "app.cli:dev"
serve = "app.cli:serve"
test = "app.cli:test"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["app"]

[tool.pytest.ini_options]
asyncio_mode = "auto"

[dependency-groups]
dev = [
    "pytest>=9.1.1",
    "pytest-asyncio>=1.4.0",
]
